# The pull request title has to be a conventional commit.
#
# Squash merge makes the title the commit subject on main, and each release
# track's version and changelog are computed from those subjects. A badly
# titled PR is not just untidy: the next release will not count or describe it
# properly. Which track a change belongs to comes from the paths it touches,
# not the title; the scope is only a label in the changelog.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # feat, fix, perf and revert (and anything breaking) start a release;
          # the rest appear in the changelog without bumping anything.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
            release
          requireScope: false
          # The subject becomes a changelog line, capitalised for you.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" should start with a lowercase
            letter and not end with a full stop. It becomes a changelog line,
            where it is capitalised for you.
