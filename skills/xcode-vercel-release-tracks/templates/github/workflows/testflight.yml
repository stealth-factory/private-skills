name: TestFlight

# Uploads the iOS/iPadOS and macOS apps to App Store Connect in two stages:
#
#   - every push to main that touches the app: internal testers (no review), labelled with the
#     next release's version so it never lands on a version that has already gone out;
#   - an __APPLE_TRACK__-vX.Y.Z tag (tag-release.yml dispatches this when the __APPLE_TRACK__ release PR merges):
#     the same upload, then the builds go to the external group and are submitted for Beta App
#     Review (Apple reviews the first build of each version only).
#
# Manual runs are allowed only at main or an __APPLE_TRACK__-v* tag, to re-run either stage; branch builds
# never reach TestFlight.
# Needs repository secrets from an App Store Connect API key (Users and Access → Integrations → Team Keys, Admin role):
#   APP_STORE_KEY_ID, APP_STORE_ISSUER_ID, APP_STORE_KEY_P8_BASE64 (base64 of the AuthKey_<id>.p8 file).
# Optional repository variables: TESTFLIGHT_EXTERNAL_GROUP names the external group (default "Public beta");
# TESTFLIGHT_LOCALE is the "What to Test" localisation (default en-US);
# STAGING_API_URL and PRODUCTION_API_URL are the API base URLs baked into internal and tagged builds.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Every path of the __APPLE_TRACK__ track in .github/release-tracks.json, so a change
    # that counts towards its release also reaches internal testers. A track whose path is
    # "." (a repo that only ships the app) deletes this filter: every push counts.
    paths:
      - "__APPLE_DIR__/**"
      - ".github/workflows/testflight.yml"
    # A hand-pushed tag. Tags from tag-release.yml are pushed with GITHUB_TOKEN, start nothing,
    # and arrive as a dispatch at the tag instead.
    tags: ["__APPLE_TRACK__-v*"]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false
  # Every upload runs: later runs wait instead of replacing a pending one. Runs never overlap,
  # which the external stage relies on to tell its builds from an earlier internal one.
  queue: max

defaults:
  run:
    working-directory: __APPLE_DIR__

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      version: ${{ steps.plan.outputs.version }}
      started: ${{ steps.plan.outputs.started }}
      certificates: ${{ steps.certificates.outputs.before }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        run: .github/scripts/install-git-cliff.sh

      - name: Which stage, and which version
        id: plan
        run: |
          set -euo pipefail
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          manifest=$(.github/scripts/release-track.sh current __APPLE_TRACK__)
          case "$GITHUB_REF" in
            refs/tags/__APPLE_TRACK__-v*)
              version="${GITHUB_REF_NAME#__APPLE_TRACK__-v}"
              # The build does not rewrite its source to match the tag: release-pr.yml bumps
              # the manifest in a commit and tag-release.yml tags that commit.
              if [ "$version" != "$manifest" ]; then
                echo "::error::Tag $GITHUB_REF_NAME but the manifest says $manifest."
                exit 1
              fi
              stage=external
              ;;
            refs/heads/main)
              subject=$(git log -1 --format=%s)
              if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$subject" =~ ^release\(__APPLE_TRACK__\): ]]; then
                # The __APPLE_TRACK__ release PR just merged; tag-release.yml starts the tagged build.
                echo "stage=skip" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              eval "$(.github/scripts/release-track.sh next __APPLE_TRACK__)"
              if [ "$release" = yes ]; then
                version="$next"
              elif [ -n "$last" ]; then
                # Nothing releasable yet, but this is still newer than the manifest's version:
                # label it the next patch, so it never joins a version that has gone out. That
                # covers the moment after a release PR merges and before its tag lands, when
                # the manifest is already ahead of the last tag.
                IFS=. read -r major minor patch <<< "$current"
                version="$major.$minor.$((patch + 1))"
              else
                version="$current"
              fi
              stage=internal
              ;;
            *)
              echo "::error::TestFlight builds only from main (internal) or an __APPLE_TRACK__-v* tag (external), not $GITHUB_REF."
              exit 1
              ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TestFlight $stage build, version $version" | tee -a "$GITHUB_STEP_SUMMARY"

      # Each upload signs on a fresh Mac, where Xcode makes a new Apple Development certificate
      # ("Created via API") that nothing can use once the runner is wiped. Apple caps them per
      # team and then refuses to sign. Note which exist now, so the certificates job can revoke
      # only the ones this run made. The snapshot is taken here, once, and not in the upload
      # jobs: those run in parallel, and one platform must not revoke a certificate another is
      # still signing with. A failed snapshot does not stop the upload; the clean-up then skips.
      - name: Install API key
        if: steps.plan.outputs.stage != 'skip'
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_KEY_P8_BASE64: ${{ secrets.APP_STORE_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/private_keys/AuthKey_$APP_STORE_KEY_ID.p8"
          mkdir -p "$(dirname "$key")"
          echo "$APP_STORE_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APP_STORE_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Snapshot development certificates
        id: certificates
        if: steps.plan.outputs.stage != 'skip'
        continue-on-error: true
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          node .github/scripts/asc-certificates.mjs snapshot "$RUNNER_TEMP/certificates-before.json"
          echo "before=$(cat "$RUNNER_TEMP/certificates-before.json")" >> "$GITHUB_OUTPUT"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

  upload:
    name: Upload ${{ matrix.platform }} build
    needs: plan
    if: needs.plan.outputs.stage != 'skip'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_P8_BASE64: ${{ secrets.APP_STORE_KEY_P8_BASE64 }}
        run: |
          for name in APP_STORE_KEY_ID APP_STORE_ISSUER_ID APP_STORE_KEY_P8_BASE64; do
            test -n "${!name}" || { echo "::error::Repository secret $name is not set. See the release setup checklist."; exit 1; }
          done

      - name: Install API key
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_KEY_P8_BASE64: ${{ secrets.APP_STORE_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/private_keys/AuthKey_$APP_STORE_KEY_ID.p8"
          mkdir -p "$(dirname "$key")"
          echo "$APP_STORE_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APP_STORE_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Build number: whole minutes since the Unix epoch at this attempt (about 29 million in 2026), so every upload,
      # re-runs of older runs included, is higher than the last. A single integer, because macOS validation limits
      # dotted build numbers to 4.2.2 digits, which a date stamp like 261022.1330 breaks.
      - name: Work out build number
        run: echo "BUILD_NUMBER=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"

      # Internal builds talk to the staging API (main's fixed staging domain on Vercel), tagged builds to production.
      # An unset variable leaves the project's own default: fine for internal builds, refused for a release.
      - name: Pick the API
        env:
          STAGE: ${{ needs.plan.outputs.stage }}
          STAGING: ${{ vars.STAGING_API_URL }}
          PRODUCTION: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ "$STAGE" = external ]; then
            url="$PRODUCTION"
            if [ -z "$url" ]; then
              echo "::error::Repository variable PRODUCTION_API_URL is not set, so this release would ship the project's default API."
              exit 1
            fi
          else
            url="$STAGING"
          fi
          echo "API_URL=$url" >> "$GITHUB_ENV"
          echo "API: ${url:-not set, so the project default applies}"

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Archive
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          xcodebuild archive -project __XCODE_PROJECT__ -scheme __SCHEME__ -configuration Release \
            -destination 'generic/platform=${{ matrix.platform }}' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_KEY_PATH" -authenticationKeyID "$APP_STORE_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="${{ needs.plan.outputs.version }}" \
            ${API_URL:+"__API_URL_SETTING__=$API_URL"}

      - name: Upload to App Store Connect
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist __EXPORT_OPTIONS_PLIST__ -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_KEY_PATH" -authenticationKeyID "$APP_STORE_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID"

      - name: Summary
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/App.xcarchive/Info.plist")
          echo "Uploaded $version ($BUILD_NUMBER) for ${{ matrix.platform }} (${{ needs.plan.outputs.stage }} testers). It shows in TestFlight after App Store Connect finishes processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

  certificates:
    name: Revoke this run's development certificates
    needs: [plan, upload]
    # After every upload has finished, passed, failed or cancelled, since a failed archive can
    # still have made a certificate. Never fails the run: the builds are already out, and
    # apple-certificates.yml clears anything left behind.
    if: always() && needs.plan.outputs.stage != '' && needs.plan.outputs.stage != 'skip'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install API key
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_KEY_P8_BASE64: ${{ secrets.APP_STORE_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/private_keys/AuthKey_$APP_STORE_KEY_ID.p8"
          mkdir -p "$(dirname "$key")"
          echo "$APP_STORE_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APP_STORE_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Revoke new development certificates
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          BEFORE: ${{ needs.plan.outputs.certificates }}
        run: |
          # No snapshot leaves no file, and the script then revokes nothing and warns.
          file="$RUNNER_TEMP/certificates-before.json"
          if [ -n "$BEFORE" ]; then printf '%s' "$BEFORE" > "$file"; fi
          set -o pipefail
          node .github/scripts/asc-certificates.mjs revoke-new "$file" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

  external:
    name: External testers and Beta App Review
    needs: [plan, upload]
    if: needs.plan.outputs.stage == 'external'
    runs-on: ubuntu-latest
    # Waits for App Store Connect to process both builds, which can take a while.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install API key
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_KEY_P8_BASE64: ${{ secrets.APP_STORE_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/private_keys/AuthKey_$APP_STORE_KEY_ID.p8"
          mkdir -p "$(dirname "$key")"
          echo "$APP_STORE_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APP_STORE_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: What to Test
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          .github/scripts/release-track.sh notes __APPLE_TRACK__ "$VERSION" > "$RUNNER_TEMP/whats-new.md"
          [ -s "$RUNNER_TEMP/whats-new.md" ] || { echo "::error::No $VERSION section in the __APPLE_TRACK__ changelog."; exit 1; }

      - name: Submit for review and add to the external group
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          BUNDLE_ID: __BUNDLE_ID__
          VERSION: ${{ needs.plan.outputs.version }}
          UPLOADED_AFTER: ${{ needs.plan.outputs.started }}
          EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP || 'Public beta' }}
          # The platforms the upload matrix builds, in App Store Connect's names
          # (IOS, MAC_OS, TV_OS, VISION_OS). It waits for a build of each.
          PLATFORMS: IOS,MAC_OS
          # The "What to Test" localisation, one the app has in TestFlight (en-US, en-AU, en-GB, …).
          WHATS_NEW_LOCALE: ${{ vars.TESTFLIGHT_LOCALE || 'en-US' }}
        run: WHATS_NEW_FILE="$RUNNER_TEMP/whats-new.md" node .github/scripts/testflight-external.mjs

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
